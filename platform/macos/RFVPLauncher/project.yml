name: RFVPLauncher
options:
  bundleIdPrefix: com.rfvp
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "11.0"
targets:
  RFVPLauncher:
    type: application
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: RFVPLauncher
    resources:
      - path: RFVPLauncher/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rfvp.launcher
        PRODUCT_NAME: RFVP
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: RFVPLauncher/Info.plist
        # The launcher loads Contents/Frameworks/librfvp.dylib with dlopen.
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: Security.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
