[workspace]
resolver = "3"
members = [
    "crates/*",
    # Console ports: each platform keeps its host crate, build script, target spec and notes
    # under platform/<name>/ (see platform/README.md).
    "platform/switch/host",
    "platform/vita/host",
    "platform/psp/host",
    # Untested skeletons.
    "platform/experimental/3ds",
    "platform/experimental/wii",
    "platform/experimental/wiiu",
    "platform/experimental/ps2",
    "platform/experimental/ps3",
]
# Patched copies of dependencies, used through [patch] below; not workspace members.
exclude = ["platform/switch/patches"]

# nx with one call removed so the Switch port runs in Ryujinx; see platform/switch/patches/README.md.
[patch."https://github.com/aarch64-switch-rs/nx"]
nx = { path = "platform/switch/patches/nx" }
