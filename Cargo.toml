[workspace]
resolver = "3"
members = [
    "crates/*",
    # Console ports: each platform keeps its host crate, build script, target spec and notes
    # under platform/<name>/ (see platform/README.md).
    "platform/switch/host",
    "platform/vita/host",
    "platform/psp/host",
    "platform/ps2/host",
    "platform/3ds/host",
    "platform/ps3/host",
    "platform/ps1/host",
    "platform/wiiu/host",
    "platform/wii/host",
]
# Patched copies of dependencies, used through [patch] below; not workspace members.
exclude = ["platform/psp/patches"]

# psp with its per-allocation kernel allocator made optional; see platform/psp/patches/README.md.
[patch.crates-io]
psp = { path = "platform/psp/patches/psp" }
